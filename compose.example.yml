services:
  clawtop:
    build: .
    container_name: clawtop
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - clawtop-data:/data
      # Morrow/Lantern + Scruffy/Unraid: copy gateways.example.json to the
      # authoritative Scruffy Compose Manager project as private gateways.json,
      # uncomment this mount, and set CLAWTOP_GATEWAYS_FILE in .env.
      # - ./gateways.json:/run/secrets/clawtop-gateways.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  clawtop-data:
